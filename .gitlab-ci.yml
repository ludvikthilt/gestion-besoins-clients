# Utiliser une image Docker officielle comme base
image: docker:latest

# Services Docker nécessaires
services:
  - docker:dind

# Configuration du cache
cache:
  paths:
    - node_modules/

# Définition des stages
stages:
  - build
  - test
  - deploy

# Étape de construction de l'image Docker
build:
  stage: build
  script:
    - docker build -t mon-application .
    - docker save mon-application > image.tar
  artifacts:
    paths:
      - image.tar

# Tests dans un conteneur
test:
  stage: test
  script:
    - docker load < image.tar
    - docker run mon-application npm test

# Déploiement
deploy:
  stage: deploy
  script:
    - docker load < image.tar
    
    # Installation de Ngrok
    - docker run -d --name mon-app mon-application
    
    # Exposer avec Ngrok
    - docker run -d \
      -e NGROK_AUTHTOKEN=$NGROK_AUTH_TOKEN \
      --network host \
      ngrok/ngrok http host.docker.internal:3000
    
    # Afficher l'URL de déploiement
    - docker logs ngrok
  
  only:
    - main
  
  variables:
    NGROK_AUTH_TOKEN: $NGROK_AUTH_TOKEN